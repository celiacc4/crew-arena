<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Lista de tareas</h1>

    <form id="task-form" class="task-form" autocomplete="off">
      <input type="text" id="task-input" placeholder="Nueva tarea..." aria-label="Nueva tarea" maxlength="200" required>
      <button type="submit">Añadir</button>
    </form>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <p id="empty-msg" class="empty-msg" hidden>No hay tareas. ¡Añade una!</p>

    <footer class="footer">
      <span id="counter"></span>
      <button type="button" id="clear-done" class="link-btn">Borrar completadas</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
